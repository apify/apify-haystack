[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "apify_haystack"
version = "0.1.7"
description = "Apify-haystack integration"
authors = [{ name = "Apify Technologies s.r.o.", email = "support@apify.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["apify", "crawler", "haystack", "rag", "scraper", "scraping"]
dependencies = [
    "apify-client>=3.3.0,<4.0.0",
    "haystack-ai>=3.0.0,<4.0.0",
]

[project.urls]
"Homepage" = "https://apify.com"
"Changelog" = "https://github.com/apify/apify-haystack/blob/main/CHANGELOG.md"
"Documentation" = "https://docs.apify.com/platform/integrations/haystack"
"Issue Tracker" = "https://github.com/apify/apify-haystack/issues"
"Repository" = "https://github.com/apify/apify-haystack"

[dependency-groups]
dev = [
    "poethepoet<1.0.0",
    "pre-commit<5.0.0",
    "pytest-asyncio<2.0.0",
    "pytest-cov<8.0.0",
    "pytest-xdist<4.0.0",
    "pytest-timeout<3.0.0",
    "pytest<10.0.0",
    "ruff~=0.17.0",
    "ty~=0.0.0",
]

[tool.uv.build-backend]
# The module, pyproject.toml, README, and LICENSE are included in the sdist by default.
source-include = ["CHANGELOG.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 120
include = ["**/*.py", "**/*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {filename}
    "BLE001",  # Do not catch blind exception
    "C901",    # `{name}` is too complex
    "COM812",  # This rule may cause conflicts when used with the formatter
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "D203",    # One blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "D413",    # Missing blank line after last section
    "EM",      # flake8-errmsg
    "FIX",     # flake8-fixme
    "G004",    # Logging statement uses f-string
    "ISC001",  # This rule may cause conflicts when used with the formatter
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PTH",     # flake8-use-pathlib
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Unused imports
]
"**/{tests}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to: "{name}"
    "S106",    # Possible hardcoded password assigned to argument: "{name}"
    "SLF001",  # Private member accessed: `{name}`
    "T20",     # flake8-print
    "TRY301",  # Abstract `raise` to an inner function
]
"**/{examples}/*" = [
    "D",      # Everything from the pydocstyle
    "INP001", # File {filename} is part of an implicit namespace package, add an __init__.py
    "S105",   # Possible hardcoded password assigned to: "{name}"
    "T20",    # flake8-print
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["haystack.utils.Secret.from_env_var"]

[tool.ruff.lint.isort]
known-local-folder = ["apify_haystack"]

[tool.ruff.lint.pylint]
max-branches = 18

[tool.pytest.ini_options]
addopts = "-r a --verbose"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 1800

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "assert_never()"]

[tool.uv]
# Minimal defense against supply-chain attacks.
exclude-newer = "24 hours"

[tool.uv.exclude-newer-package]
# Allow internal Apify packages to install immediately.
apify-client = false
impit = false

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = { cmd = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov", help = "Remove build artifacts and clean caches" }
install-sync = { cmd = "uv sync --all-extras", help = "Sync dependencies with all extras" }
build = { cmd = "uv build", help = "Build the package" }
type-check = { cmd = "uv run ty check", help = "Run the type checker" }
unit-tests = { cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/unit", help = "Run unit tests" }
unit-tests-cov = { cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify_haystack --cov-report=xml:coverage-unit.xml tests/unit", help = "Run unit tests with an XML coverage report" }
check-code = { sequence = ["lint", "type-check", "unit-tests"], help = "Run lint, type check, and unit tests" }

[tool.poe.tasks.install-dev]
shell = "uv sync --all-extras && uv run pre-commit install"
help = "Install development dependencies and pre-commit hooks"

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"
